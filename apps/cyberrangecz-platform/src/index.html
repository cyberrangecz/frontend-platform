<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>CyberRangeᶜᶻ Platform</title>
    <base href="/">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <link href="/assets/icon/favicon.ico" rel="icon" type="image/x-icon">
    <style>

        .loading-container {
            position: fixed;
            inset: 0;
            background: #ffffff;
            font-family: 'Inter', sans-serif;
            z-index: 9999;
        }

        .loading-content {
            position: absolute;
            inset: 90px 0 0 0;
            display: grid;
            place-items: center;
        }

        @media (width < 720px) {
            .loading-content {
                left: 140px;
            }
        }

        .loading-mark {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
        }

        .loading-logo {
            width: 200px;
            height: 200px;
        }

        .loader {
            width: fit-content;
            white-space: nowrap;
            font-weight: bold;
            font-family: monospace;
            font-size: 30px;
            background: linear-gradient(135deg, #0000 calc(50% - 0.5em), #000 0 calc(50% + 0.5em), #0000 0) right/300% 100%;
            animation: l22 2s infinite;
            border-radius: 1rem;
        }

        .loader::before {
            content: attr(data-label);
            color: #0000;
            padding: 0 5px;
            background: inherit;
            background-image: linear-gradient(135deg, #000 calc(50% - 0.5em), #fff 0 calc(50% + 0.5em), #000 0);
            -webkit-background-clip: text;
            background-clip: text;
        }

        @keyframes l22 {
            100% {
                background-position: left
            }
        }

        .sidebar {
            position: absolute;
            left: 0;
            width: 140px;
            height: 100%;
            background: linear-gradient(147deg, #03031f 0%, #141f64 250%);
        }

        .toolbar-top {
            position: absolute;
            top: 0;
            right: 0;
            width: calc(100% - 140px);
            height: 50px;
            background: #4045ea;
            box-shadow: 0 3px 5px -1px #0003, 0 6px 10px #00000024, 0 1px 18px #0000001f;
        }

        .toolbar-bottom {
            position: absolute;
            top: 50px;
            right: 0;
            width: calc(100% - 140px);
            height: 40px;
            background: #4045ea;
        }

        .layout-overlay {
            position: absolute;
            inset: 0;
            color: #ffffff;
            animation: fadeIn 0.5s ease-in-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .loading-sidebar-logo {
            position: absolute;
            top: 24px;
            left: 30.5px;
            width: 75px;
            height: 75px;
            filter: brightness(100);
        }

        .loading-notifications {
            position: absolute;
            top: 13px;
            right: 24px;
            width: 24px;
            height: 24px;
            fill: currentColor;
        }
    </style>
</head>
<body>
<crczp-app-root class="mat-typography">
    <div aria-label="Loading" class="loading-container" role="status">
        <div class="loading-content">
            <div class="loading-mark">
                <img alt="CyberRangeᶜᶻ Platform" class="loading-logo" src="./assets/logo/logo-black.svg" />
                <div class="loader" data-label="Loading..."></div>
            </div>
        </div>
        <div class="layout-overlay">
            <div class="sidebar"></div>
            <div class="toolbar-bottom"></div>
            <div class="toolbar-top"></div>
            <img alt="" class="loading-sidebar-logo" src="./assets/logo/logo-black.svg" />
            <svg aria-hidden="true" class="loading-notifications" viewBox="0 0 24 24">
                <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z" />
            </svg>
        </div>
    </div>
</crczp-app-root>
</body>
</html>
