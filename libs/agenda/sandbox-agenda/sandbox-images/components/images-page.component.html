<div class="content">

    <div>
        <div class="checkbox-images">
            <mat-checkbox (change)="osImagesToggled()">Only custom images</mat-checkbox>
            <mat-checkbox (change)="guiAccessToggled()">Only GUI access</mat-checkbox>
        </div>
        @let table = images$ | async;
        <crczp-table-panel (filterChange)="onFilter($event)" [filterLabel]="table?.filterLabel ?? ''" [filterValue]="filter">
            <sentinel-table
                [columns]="table?.columns ?? []"
                [defaultSortName]="DEFAULT_SORT_COLUMN"
                [defaultSortDirection]="DEFAULT_SORT_DIRECTION"
                [expand]="table?.expand"
                [hasError]="!!(imagesTableHasError$ | async)"
                [isLoading]="!!(isLoadingImages$ | async)"
                [pagination]="table?.pagination"
                [rows]="table?.rows ?? []"
                [selectable]="!!table?.selectable"
                (tableLoad)="onTableLoadEvent($event)"
                crczpTableEmptyState="No virtual machine images are available"
            >
            </sentinel-table>
        </crczp-table-panel>
    </div>

</div>
