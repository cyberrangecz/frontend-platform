@let table = pools$ | async;
<crczp-table-panel>
    <sentinel-controls [controls]="controls" [withMargin]="false" tablePanelActions />
    <sentinel-table
        (tableLoad)="onLoadEvent($event)"
        [columns]="table?.columns ?? []"
        [defaultSortDirection]="DEFAULT_SORT_DIRECTION"
        [defaultSortName]="DEFAULT_SORT_COLUMN"
        [displayedActionsCount]="8"
        [expand]="table?.expand"
        [hasError]="!!(hasError$ | async)"
        [isLoading]="!!(isLoading$ | async)"
        [pagination]="table?.pagination"
        [rows]="table?.rows ?? []"
        [selectable]="!!table?.selectable"
        [titlecasedActions]="false"
        [titlecasedColumnHeaders]="false"
        crczpTableEmptyState="No sandbox pools have been created yet">
        <ng-template [sentinelCellType]="table?.rows" let-row sentinelCell="title">
            <a [routerLink]="row.links.get('title')">{{ row.element.title }}</a>
        </ng-template>
        <ng-template [sentinelCellType]="table?.rows" let-row sentinelCell="lockState">
            <crczp-table-state-cell [iconColor]="" [icon]="getPoolStateIcon(row)" [text]="row.element.lockState" />
        </ng-template>
        <ng-template [sentinelCellType]="table?.rows" let-row sentinelCell="comment">
            <crczp-editable-comment (commentChanged)="updatePoolComment(row.element, $event)" [value]="row.element.comment" />
        </ng-template>
    </sentinel-table>
</crczp-table-panel>

<br>

<crczp-quotas [resources]="resources$" />
