@let outputs = outputsState();
@if (outputs.status === 'loading' || (outputs.status === 'fetched' && outputs.content)) {
    <crczp-log-view
        [downloadFileName]="logFileName()"
        [height]="height()"
        [loading]="outputs.status === 'loading'"
        [readonly]="true"
        shortcutScope="document"
        [syntaxHighlighting]="syntaxHighlighting()"
        [value]="outputs.status === 'fetched' ? outputs.content : undefined"
        class="allocation-stage-detail-log"
    />
} @else if (outputs.status === 'fetched' && isStageSettled()) {
    <div class="allocation-stage-detail-empty">Stage has no outputs</div>
}
