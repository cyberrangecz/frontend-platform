<sentinel-controls
    [controls]="rolesToAssignControls()"
    class="to-assign-controls">
</sentinel-controls>
<mat-card appearance="outlined">
    <mat-card-header class="card-icon-header">
        <div mat-card-avatar>
            <mat-icon color="primary">add_circle_outline</mat-icon>
        </div>
        <mat-card-title>Add roles</mat-card-title>
        <mat-card-subtitle>Add roles to {{ group().name }} group</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content class="m-1rem-top">
        <sentinel-resource-selector
            (fetch)="search($event)"
            (selectionChange)="onRolesToAssignSelection($event)"
            [resourceMapping]="roleMapping"
            [resources]="roles()"
            [selected]="selectedRolesToAssign$ | async"
            searchPlaceholder="Search roles by name" />
    </mat-card-content>
</mat-card>

<sentinel-controls
    [controls]="assignedRolesControls()"
    class="assigned-controls">
</sentinel-controls>
<mat-card appearance="outlined">
    <mat-card-header class="card-icon-header">
        <div mat-card-avatar>
            <mat-icon color="primary">policy</mat-icon>
        </div>
        <mat-card-title> Roles of group {{ group().name }}</mat-card-title>
    </mat-card-header>
    <mat-card-content class="m-1rem-top">
        @let table = assignedRoles$ | async;
        @if (table?.filterable) {
            <sentinel-filter-free-input
                (filterChange)="onFilter($event)"
                (filterCleared)="onFilter('')"
                [label]="table.filterLabel"
                [placeholder]="table.filterLabel"
                [value]="filter" />
        }
        <sentinel-table
            (rowSelection)="onAssignedRolesSelection($event)"
            (tableLoad)="onAssignedRolesLoad($event)"
            [columns]="table?.columns ?? []"
            [defaultSortDirection]="ROLES_OF_GROUP_INIT_SORT_DIR"
            [defaultSortName]="ROLES_OF_GROUP_INIT_SORT_NAME"
            [elevation]="0"
            [hasError]="!!(assignedRolesHasError$ | async)"
            [isLoading]="!!(isLoadingAssignedRoles$ | async)"
            [pagination]="table?.pagination"
            [rows]="table?.rows ?? []"
            [selectable]="!!table?.selectable"
            crczpTableEmptyState="No roles assigned to this group yet" />
    </mat-card-content>
</mat-card>
