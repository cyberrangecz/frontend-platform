<mat-card appearance="outlined">
    <mat-card-header>
        <div class="role-avatar" mat-card-avatar>
            <mat-icon color="primary">policy</mat-icon>
        </div>
        <mat-card-title>{{ isDefaultRole ? 'Default Role' : 'Role' }}</mat-card-title>
        <mat-card-subtitle>
            @if (isDefaultRole) {
                Every user of this microservice receives this role
            } @else {
                This role will be available to assign to groups and users
            }
        </mat-card-subtitle>
        <span class="spacer"></span>
        <div class="role-remove">
            <button (click)="delete.emit()"
                    [attr.aria-label]="isDefaultRole ? 'Default role cannot be removed' : 'Delete role'"
                    [disabled]="isDefaultRole"
                    [disabledInteractive]="isDefaultRole"
                    [matTooltip]="isDefaultRole ? 'Microservice has to have a default role' : 'Delete role'"
                    mat-icon-button
                    type="button">
                <mat-icon>close</mat-icon>
            </button>
        </div>
    </mat-card-header>
    <mat-card-content>
        <div [formGroup]="roleFormGroup" class="form-container">

            <!-- TYPE field-->
            <mat-form-field appearance="outline">
                <mat-label>Type</mat-label>
                <input #typeInput formControlName="type" matInput placeholder="Type" required>
                <crczp-clear-input-suffix [control]="type" label="Clear type" matSuffix />
                <mat-error>Type cannot be empty</mat-error>
            </mat-form-field>

            <!-- DESCRIPTION field-->
            <mat-form-field appearance="outline">
                <mat-label>Description</mat-label>
                <textarea
                    cdkTextareaAutosize
                    cdkAutosizeMaxRows="8"
                    cdkAutosizeMinRows="3"
                    formControlName="description" matInput
                    [maxlength]="descriptionMaxLength"
                    placeholder="Description">
                </textarea>
                <crczp-clear-input-suffix [control]="description" label="Clear description" matSuffix />
                <mat-hint align="end">{{ description.value.length }}/{{ descriptionMaxLength }}</mat-hint>
            </mat-form-field>
        </div>
    </mat-card-content>
</mat-card>
