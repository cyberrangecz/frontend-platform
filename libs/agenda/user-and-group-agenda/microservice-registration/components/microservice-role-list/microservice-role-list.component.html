<h2 class="rolelist-heading" id="rolelist-heading">Roles</h2>

<ul aria-labelledby="rolelist-heading" class="rolelist-items" role="list">
  @for (roleFormGroup of roles.controls; track roleFormGroup; let index = $index) {
    <li>
      <crczp-microservice-role
        (delete)="removeRole.emit(index)"
        [roleFormGroup]="roleFormGroup"
        [isDefaultRole]="index === defaultRoleIndex" />
    </li>
  }
</ul>

<div class="rolelist-controls">
  <button
    (click)="onAddRole()"
    mat-stroked-button
    type="button"
  >Add role</button>
</div>
