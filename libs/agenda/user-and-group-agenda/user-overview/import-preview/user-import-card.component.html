<article class="user-import-card">
    <mat-icon class="user-import-card-icon">person</mat-icon>
    <div class="user-import-card-text">
        <span class="user-import-card-name">{{ entity().fullName ?? entity().sub }}</span>
        <span class="user-import-card-identity">{{ entity().sub }} · {{ entity().issuer }}</span>
    </div>
</article>
