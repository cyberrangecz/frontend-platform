<div class="content">
    <div class="access-container">
        <crczp-access-training-run (accessToken)="access($event)" [isLoading]="isLoading()" />
        @if (sandboxWaitMessage$ | async; as sandboxWaitMessage) {
            <div class="sandbox-wait" role="status">
                <mat-icon>info</mat-icon>
                <span>{{ sandboxWaitMessage }}</span>
            </div>
        }
        @if (ownSandboxes$ | async; as ownSandboxes) {
            @if (ownSandboxes.length > 0) {
                <crczp-own-sandboxes (remove)="removeOwnSandbox($event)" [sandboxes]="ownSandboxes" />
            }
        }
    </div>
    <div class="table-container">
        <sentinel-controls [controls]="controls"
                           [titlecased]="false" />
        @let table = trainingRuns$ | async;
        <sentinel-table
            (tableLoad)="loadAccessedTrainingRuns($event)"
            [columns]="table?.columns ?? []"
            [defaultSortDirection]="INITIAL_SORT_DIR"
            [defaultSortName]="INITIAL_SORT_NAME"
            [hasError]="!!(hasError$ | async)"
            [isLoading]="!!(tableIsLoading$ | async)"
            [pagination]="table?.pagination"
            [rows]="table?.rows ?? []"
            [selectable]="!!table?.selectable"
            crczpTableEmptyState="You have not accessed any training runs yet"
        >
        </sentinel-table>
    </div>
</div>
