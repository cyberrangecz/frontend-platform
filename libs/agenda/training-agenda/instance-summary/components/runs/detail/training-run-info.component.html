<div class="detail-container">
    @if (!isLoading()) {
        <sentinel-table
            (tableLoad)="onLoadEvent()"
            [columns]="info()?.columns ?? []"
            [hasError]="hasError()"
            [pagination]="info()?.pagination"
            [rows]="info()?.rows ?? []"
            [selectable]="!!info()?.selectable"
            crczpTableEmptyState="No information available for this training run"
        >
        </sentinel-table>
    } @else {
        <ngx-skeleton-loader animation="pulse" [theme]="skeletonTheme" />
    }
</div>
