<div>
    <sentinel-controls [controls]="topControls" />
    @let table = cheatingDetections$ | async;
    <sentinel-table (tableLoad)="onLoadEvent($event)"
                    [columns]="table?.columns ?? []"
                    [defaultSortDirection]="INIT_SORT_DIR"
                    [defaultSortName]="INIT_SORT_NAME"
                    [displayedActionsCount]="4"
                    [hasError]="!!(hasError$ | async)"
                    [isLoading]="!!(isLoading$ | async)"
                    [pagination]="table?.pagination"
                    [rows]="table?.rows ?? []"
                    [selectable]="!!table?.selectable"
                    crczpTableEmptyState="No cheating detections have been run yet">
        <ng-template [sentinelCellType]="table?.rows" let-row sentinelCell="stages">
            <crczp-stage-overview [stages]="row.element.stages"
                                  [unitId]="row.element.unitId">
            </crczp-stage-overview>
        </ng-template>
    </sentinel-table>
</div>
