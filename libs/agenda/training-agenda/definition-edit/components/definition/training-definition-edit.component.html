<div class="content">
  <form [formGroup]="trainingDefinitionEditFormGroup.formGroup">
    <div class="form-container">
      <div class="left-col">
        <!-- TITLE field-->
        <mat-form-field appearance="outline"
          (keydown.enter)="$event.preventDefault()">
          <mat-label>Title</mat-label>
          <input matInput placeholder="Title" formControlName="title" required>
          <crczp-clear-input-suffix [control]="title" label="Clear title" matSuffix />
          @if (title.hasError('whitespace')) {
            <mat-error>Title cannot be empty</mat-error>
          }
        </mat-form-field>


        <!-- DESCRIPTION field-->
        <mat-form-field appearance="outline"
          (keydown.enter)="$event.preventDefault()">
          <mat-label>Description</mat-label>
          <textarea cdkTextareaAutosize cdkAutosizeMaxRows="8" cdkAutosizeMinRows="3"
          maxlength="2048" matInput placeholder="Description"
          formControlName="description"></textarea>
          <crczp-clear-input-suffix [control]="description" label="Clear description" matSuffix />
        </mat-form-field>


        <div class="checkboxes-container">

          <!-- DEFAULT CONTENT checkbox -->
          @if (!trainingDefinition.id) {
            <div class="form-line">
              <div class="form-line-content">
                <mat-checkbox
                  matTooltip="When active, predefined levels will be created when definition is saved."
                  labelPosition="after"
                  formControlName="defaultContent"
                  (change)="checkboxTouched()">
                  Create predefined levels
                </mat-checkbox>
              </div>
            </div>
          }
        </div>

      </div>

      <div class="right-col">
        <!-- PREREQUISITES field-->
        <sentinel-free-form (itemsChange)="prerequisitesChange($event)"
          [required]="false" [hasHeader]="true" [formPlaceholder]="'Note'"
          [formName]="'Notes for instructors'"
          [formData]="prerequisites">
        </sentinel-free-form>

        <!-- OUTCOMES field-->
        <sentinel-free-form (itemsChange)="outcomesChange($event)"
          [required]="false" [hasHeader]="true" [formPlaceholder]="'Outcome'"
          [formName]="'Learning outcomes'"
          [formData]="outcomes">
        </sentinel-free-form>
      </div>
    </div>
  </form>
</div>
