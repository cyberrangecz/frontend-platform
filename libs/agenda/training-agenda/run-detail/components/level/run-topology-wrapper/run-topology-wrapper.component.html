<div class="hflex ai-center wh-100">
    @let topologyCollapsed = topologyService.topologyCollapsed$ | async;
    @if (topologyAllowed()) {
        <button
            (click)="topologyService.toggleCollapsed()"
            class="expand-topology-button"
            matTooltip="{{ topologyCollapsed ? 'Show' : 'Hide' }} topology"
            matTooltipPosition="left"
        >
            <mat-icon>
                {{ topologyCollapsed ? 'polyline' : 'chevron_right' }}
            </mat-icon>
        </button>
    }
    @let sandboxInstanceId = (this.runService.runInfo$.observeProperty().sandboxInstanceId.$() | async);
    @if (!!sandboxInstanceId) {
        <crczp-topology-wrapper
            [id]="{instanceId: sandboxInstanceId}"
            [ngClass]="{ 'level-topology--hidden': topologyCollapsed }"
            [standalone]="false"
            class="wh-100 level-topology"
        >
            <div class="panel-actions" topologyActions>
                <button
                    (click)="onAccessFileRequested()"
                    class="panel-actions__item"
                    matTooltip="Download config for SSH client"
                    matTooltipPosition="above"
                >
                    <mat-icon class="panel-actions__icon">download</mat-icon>
                    SSH Config
                </button>

                <span aria-hidden="true" class="panel-actions__divider"></span>

                <button
                    (click)="onVpnCommandRequested()"
                    class="panel-actions__item"
                    matTooltip="Copy the command connecting to the sandbox over VPN"
                    matTooltipPosition="above"
                >
                    <mat-icon class="panel-actions__icon">file_copy</mat-icon>
                    VPN connection
                </button>
            </div>
        </crczp-topology-wrapper>
    }
</div>
