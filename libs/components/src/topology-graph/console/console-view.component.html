<div
    #guacWrapper
    (focusin)="lockKeyboard()"
    (focusout)="unlockKeyboard()"
    [ngClass]="{'guacamole-wrapper--unfocused': !this.keyboardLocked()}"
    [ngStyle]="buildWrapperStyle()"
    class="guacamole-wrapper wh-100"
    tabindex="0"
>
    <div #guacContainer>
        @if (inputHintVisible()) {
            <crczp-console-input-hint
                [clipboardGuidance]="clipboardGuidanceNeeded()"
                [commandKeyPlatform]="commandKeyPlatform"
                [class.guacamole-input-hint--gutter]="!connectionParams().withGui"
                [graphical]="connectionParams().withGui"
                class="guacamole-input-hint" />
        }
    </div>

    <crczp-guacamole-status
        [clientStateCode]="clientStateCode()"
        [tunnelStateCode]="tunnelStateCode()" />
</div>
