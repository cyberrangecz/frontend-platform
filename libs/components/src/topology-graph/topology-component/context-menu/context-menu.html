@if (visible()) {
    <div
        #contextMenu
        (crczpClickOutside)="onOutsideClick()"
        [style.left.px]="position().x"
        [style.top.px]="position().y"
        class="context-menu"
    >
        <ul role="menu">
            @for (item of menuData(); track item.label) {
                <li (click)="activateItem(item)"
                    (keydown.enter)="activateItem(item)"
                    (keydown.space)="activateItem(item); $event.preventDefault()"
                    role="menuitem"
                    tabindex="0">
                    <span class="label">{{ item.label }}</span>
                </li>
            } @empty {
                <li (click)="hideContextMenu()"
                    (keydown.enter)="hideContextMenu()"
                    (keydown.space)="hideContextMenu(); $event.preventDefault()"
                    role="menuitem"
                    tabindex="0">
                    <span class="label">No actions available</span>
                </li>
            }
        </ul>
    </div>
}
