<mat-button-toggle-group
    class="segmented-toggle"
    [hideSingleSelectionIndicator]="true"
    [value]="value()"
    (change)="valueChange.emit($event.value)"
>
    @for (option of options(); track option.value) {
        <mat-button-toggle
            [value]="option.value"
            [matTooltip]="option.tooltip ?? (iconOnly() ? option.label : '')"
            [matTooltipDisabled]="!option.tooltip && !iconOnly()"
            [attr.aria-label]="iconOnly() ? option.label : null"
        >
            @if (option.icon) {
                <mat-icon>{{ option.icon }}</mat-icon>
            }
            @if (!iconOnly()) {
                {{ option.label }}
            }
        </mat-button-toggle>
    }
</mat-button-toggle-group>
