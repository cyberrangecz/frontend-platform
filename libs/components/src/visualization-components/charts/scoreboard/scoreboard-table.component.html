<crczp-chart-panel-shell
    heading="Scoreboard"
    [status]="status()"
    [exportable]="this"
>
    <div class="scoreboard-scroll">
        <table
            mat-table
            class="scoreboard-table"
            [dataSource]="sortedRows()"
            [trackBy]="trackByRunId"
            matSort
            [matSortActive]="sortState().active"
            [matSortDirection]="sortState().direction"
            matSortDisableClear
            (matSortChange)="onSortChange($event)"
        >
            <ng-container matColumnDef="rank">
                <th mat-header-cell *matHeaderCellDef mat-sort-header arrowPosition="after">#</th>
                <td mat-cell *matCellDef="let row">{{ row.rank }}</td>
            </ng-container>

            <ng-container matColumnDef="trainee">
                <th mat-header-cell *matHeaderCellDef mat-sort-header arrowPosition="after">Trainee</th>
                <td mat-cell *matCellDef="let row">
                    <crczp-trainee-identity
                        class="scoreboard-trainee-name"
                        [name]="row.traineeName"
                        [picture]="row.traineePicture"
                    />
                </td>
            </ng-container>

            <ng-container matColumnDef="state">
                <th mat-header-cell *matHeaderCellDef mat-sort-header arrowPosition="after">State</th>
                <td mat-cell *matCellDef="let row">
                    <crczp-run-state-chip [state]="row.state" />
                </td>
            </ng-container>

            <ng-container matColumnDef="score">
                <th mat-header-cell *matHeaderCellDef mat-sort-header arrowPosition="after">Score</th>
                <td mat-cell *matCellDef="let row">{{ row.scoreText }}</td>
            </ng-container>

            <ng-container matColumnDef="time">
                <th mat-header-cell *matHeaderCellDef mat-sort-header arrowPosition="after">Time</th>
                <td mat-cell *matCellDef="let row">{{ row.durationText }}</td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns"
                [attr.data-run-id]="row.trainingRunId"
                [crczpRichTooltip]="row.tooltip"
            ></tr>
        </table>
    </div>
</crczp-chart-panel-shell>
