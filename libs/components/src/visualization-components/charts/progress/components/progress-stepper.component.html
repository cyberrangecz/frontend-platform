<div [class.progress-stepper-track--scrollable]="isOverflowing()">
    <div
        #stepperContainer
        class="progress-stepper-track">
        @for (resolved of resolvedItems(); track resolved.item.levelId) {
            <!-- Step node -->
            <div
                (click)="onStepClick(resolved)"
                (mouseenter)="stepHovered.emit(resolved.item.order)"
                (mouseleave)="stepHovered.emit(null)"
                [class.progress-stepper-step--selected]="resolved.selected"
                [class.progress-stepper-step--accessible]="resolved.accessible"
                [class.progress-stepper-step--locked]="!resolved.accessible"
                [class.progress-stepper-step--highlighted]="resolved.highlighted"
                class="progress-stepper-step"
            >
                <div
                    (keydown.enter)="onStepClick(resolved)"
                    (keydown.space)="onStepClick(resolved)"
                    [attr.tabindex]="resolved.accessible ? 0 : -1"
                    [attr.aria-disabled]="resolved.accessible ? null : 'true'"
                    [class.progress-stepper-step__node--selected]="resolved.selected"
                    [class.progress-stepper-step__node--accessible]="resolved.accessible"
                    [class.progress-stepper-step__node--locked]="!resolved.accessible"
                    role="button"
                    class="progress-stepper-step__node">
                    <mat-icon>{{ resolved.icon }}</mat-icon>
                </div>
                <div class="progress-stepper-step__label">
                    <span class="progress-stepper-step__label-title">{{ resolved.item.title }}</span>
                    <span class="progress-stepper-step__label-count">{{ resolved.item.activeTraineeCount }} active</span>
                </div>
            </div>

            <!-- Connecting line between consecutive nodes -->
            @if ($index < resolvedItems().length - 1) {
                <div
                    [class.progress-stepper-line--selected]="resolved.nextLineSelected"
                    [class.progress-stepper-line--locked]="resolved.nextLineLocked"
                    [class.progress-stepper-line--fade]="resolved.nextLineFade"
                    [class.progress-stepper-line--fade-reverse]="resolved.nextLineFadeReverse"
                    class="progress-stepper-line">
                </div>
            }
        }
    </div>
</div>
