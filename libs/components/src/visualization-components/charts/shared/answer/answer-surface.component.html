<div
    class="surface"
    role="button"
    tabindex="0"
    [class.surface--cell]="layout() === 'cell'"
    [class.surface--focused-trainee]="focusedTraineeChose()"
    [style.--highlight-trainee]="traineeHighlightColor"
    [style.background-color]="tintBackground()"
    (click)="answerClick.emit()"
    (keydown)="onActivateKey($event)"
>
    <div class="surface--intent">
        <mat-icon class="surface--marker" aria-hidden="true">{{ markerIcon() }}</mat-icon>

        <span class="surface--label" crczpOverflowTooltip><ng-content /></span>
    </div>

    <crczp-avatar-stack
        class="surface--faces"
        [faces]="faces()"
        (faceClick)="faceClick.emit($event)"
    />

    <crczp-distribution-bar
        class="surface--bar"
        [count]="count()"
        [percent]="percent()"
        [correctness]="correctness()"
    />
</div>
